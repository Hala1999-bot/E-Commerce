<div
  class="overflow-hidden text-green-950 bg-white card border rounded shadow-md p-1 group/card"
>
  <div
    [routerLink]="['/details', product.slug, product.id]"
    class="cursor-pointer"
  >
    {{ data | date : "shortDate" }}
    <img [src]="product.imageCover" height="100px" alt="product.title" />
    <h3 class="text-green-950">{{ product.category.name | term : 2 }}</h3>
    <h4 class="line-clamp-1">{{ product.title | term : 3 }}</h4>
    <div class="flex items-center justify-between">
      <span>{{ product.price }}EGP</span>
      <span
        ><i class="fas fa-star text-yellow-500"></i
        >{{ product.ratingsAverage }}</span
      >
    </div>
  </div>
  <button
    (click)="addProductItemToCart(product._id)"
    class="btn translate-y-[120%] group-hover/card:translate-y-0"
  >
    Add To Cart
  </button>
</div>
