<section class="p-6">
  <h1 class="text-3xl font-bold text-center mb-6">All Orders</h1>

  <div *ngIf="loading" class="text-center">Loading...</div>

  <div *ngIf="!loading && orders.length === 0" class="text-center">
    No orders found.
  </div>

  <div *ngIf="!loading && orders.length > 0" class="space-y-4">
    <div *ngFor="let order of orders" class="bg-white shadow-md p-4 rounded-lg">
      <h2 class="text-xl font-semibold">Order #{{ order._id }}</h2>
      <!-- <p>Status: {{}}</p> -->
      <p>Total: {{ order.totalOrderPrice }} EGP</p>

      <div class="mt-2">
        <h3 class="font-bold">Items:</h3>
        <ul class="list-disc ml-5">
          <li *ngFor="let item of order.cartItems">
            {{ item.product.name }} - Qty: {{ item.count }}
          </li>
        </ul>
      </div>
    </div>
  </div>
</section>
