<section class="py-14">
  <div class="container">
    <h1 class="text-center text-4xl mb-4">Details Products:</h1>
    <div class="items-center gap-4 grid sm:grid-cols-12">
      <div class="col-span-3">
        <img [src]="productDetails.imageCover" [alt]="productDetails.title" />
      </div>
      <div class="col-span-9">
        <h2 class="text-2xl">{{ productDetails.title }}</h2>
        <p class="text-green-700 text-sm my-3">
          {{ productDetails.description }}
        </p>
        <span>{{ productDetails.category.name }}</span>

        <div class="flex items-center justify-between">
          <span>{{ productDetails.price }}EGP</span>
          <span
            ><i class="fas fa-star text-yellow-500"></i
            >{{ productDetails.ratingsAverage }}</span
          >
        </div>

        <button class="btn mt-2">Add To Cart</button>
      </div>
    </div>
  </div>
</section>
