<section class="bg-gray-400 py-10 border">
  <div class="container">
    <h2 class="text-4xl text-yellow-800">Populer Products</h2>

    <div
      class="parent mt-4 grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"
    >
      @for (product of productList.slice(0,10); track product.id) {
      <app-card [product]="product" />
      }
    </div>
  </div>
</section>
