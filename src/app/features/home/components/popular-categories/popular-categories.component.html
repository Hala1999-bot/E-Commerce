<section class="py-14">
  <h2 class="text-4xl mb-4">Shop Popular Categories</h2>
  <div class="container">
    <owl-carousel-o [options]="customOptions">
      @for (category of categoriesList; track category.id) {
      <ng-template carouselSlide [id]="category.id">
        <div class="border rounded border-green-700 p-2">
          <img
            [src]="category.image"
            class="w-full h-[250px]"
            [alt]="category.name"
          />
          <h3 mt-2>{{ category.name }}</h3>
        </div>
      </ng-template>
      }
    </owl-carousel-o>
  </div>
</section>
