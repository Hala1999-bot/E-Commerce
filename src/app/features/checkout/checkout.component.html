<section class="bg-gray-300 p-10 my-14 md:w-1/2 shadow mx-auto">
  <h1 class="text-center text-4xl my-3">CheckOut</h1>
  <form [formGroup]="checkOutForm" (ngSubmit)="submitForm()">
    <app-input
      [element]="'text'"
      [control]="checkOutForm.get('shippingAddress')?.get('details')"
      [idInput]="'details'"
      [labelInput]="'Details'"
    ></app-input>
    <app-input
      [element]="'input'"
      [control]="checkOutForm.get('shippingAddress')?.get('phone')"
      [idInput]="'phone'"
      [labelInput]="'Phone'"
      [typeInput]="'tel'"
      >Accept only Egypt phone numbers</app-input
    >
    <app-input
      [element]="'input'"
      [control]="checkOutForm.get('shippingAddress')?.get('city')"
      [idInput]="'city'"
      [labelInput]="'city'"
      [typeInput]="'text'"
    ></app-input>
    <div class="flex items-center space-x-10">
      <button class="btn">Payment By Visa</button>
      <!-- <button class="btn">Payment By Cash</button> -->
    </div>
  </form>
</section>
