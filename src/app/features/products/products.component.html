<section class="bg-gray-400 py-10 border">
  <div class="container">
    <h2 class="text-4xl text-yellow-800">Products List</h2>
    <input
      [(ngModel)]="text"
      type="search"
      class="border border-green-800 block w-1/2 mx-auto my-10"
    />
    <div
      class="parent mt-4 grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"
    >
      @for (product of productList | paginate: { id: 'foo', itemsPerPage:
      pageSize, currentPage: p, totalItems: total } |search:text ; track
      product.id) {
      <app-card [product]="product" />

      }
    </div>

    <div class="flex justify-center mt-4">
      <pagination-controls
        class="my-pagination"
        id="foo"
        (pageChange)="getAllProductsData($event)"
      >
      </pagination-controls>
    </div>
  </div>
</section>
